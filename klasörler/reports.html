<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="page_title_reports">Reports - FocusTrack</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/layout/sidebar.css" />
    <link rel="stylesheet" href="css/components/card.css" />
    <link rel="stylesheet" href="css/pages/reports.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="kapsayici">
      <div id="sidebar-container"></div>
      <main class="responsive-container">
        <div class="responsive-content">
          <header class="reports-header">
            <h2 data-i18n="reports_title">Reports</h2>
            <p data-i18n="reports_subtitle">
              Your performance metrics for the current week.
            </p>
          </header>
          <div class="reports-grid" id="goals-container">
            <div class="card report-large-card">
              <div class="report-card-header">
                <div>
                  <h3 class="report-title" data-i18n="reports_rate">
                    Görev Tamamlama Oranı
                  </h3>
                  <p class="report-subtitle" data-i18n="reports_rate_subtitle">
                    Weekly progress toward goals
                  </p>
                </div>
                <div class="icon-box-purple">
                  <img
                    src="assets/icons/oran.svg"
                    alt="Oran"
                    class="report-icon-purple"
                  />
                </div>
              </div>
              <div id="completion-rate-text" class="report-main-value">...</div>
              <div class="progress-bar-large">
                <div
                  id="completion-progress-bar"
                  class="progress-fill-green"
                  style="width: 0%"
                ></div>
              </div>
            </div>
            <div class="card report-small-card">
              <div class="report-card-header">
                <h3 class="report-title" data-i18n="reports_completed_card">
                  Tamamlanan<br />Görev
                </h3>
                <span class="small-icon">
                  <img
                    src="assets/icons/tamamlanan.svg"
                    alt="Tamamlanan"
                    class="report-icon-purple"
                  />
                </span>
              </div>
              <div id="completed-count" class="report-main-value">...</div>
            </div>
            <div class="card report-small-card">
              <div class="report-card-header">
                <h3 class="report-title" data-i18n="reports_pending_card">
                  Bekleyen
                </h3>
                <span class="small-icon">
                  <img
                    src="assets/icons/hourglass.svg"
                    alt="Bekleyen"
                    class="report-icon-purple"
                  />
                </span>
              </div>
              <div id="pending-count" class="report-main-value">...</div>
            </div>
          </div>
          <div class="reports-grid goals-report-grid">
            <div class="card report-large-card">
              <div class="report-card-header">
                <div>
                  <h3 class="report-title" data-i18n="reports_goal_rate">
                    Hedef Tamamlama Oranı
                  </h3>
                  <p
                    class="report-subtitle"
                    data-i18n="reports_goal_rate_subtitle"
                  >
                    Monthly progress toward goals
                  </p>
                </div>
                <div class="icon-box-purple">
                  <img
                    src="assets/icons/oran.svg"
                    alt="Oran"
                    class="report-icon-purple"
                  />
                </div>
              </div>
              <div id="goal-completion-rate-text" class="report-main-value">
                ...
              </div>
              <div class="progress-bar-large">
                <div
                  id="goal-completion-progress-bar"
                  class="progress-fill-green"
                  style="width: 0%"
                ></div>
              </div>
            </div>
            <div class="card report-small-card">
              <div class="report-card-header">
                <h3 class="report-title" data-i18n="reports_goal_completed">
                  Tamamlanan<br />Hedef
                </h3>
                <span class="small-icon">
                  <img
                    src="assets/icons/tamamlanan.svg"
                    alt="Tamamlanan"
                    class="report-icon-purple"
                  />
                </span>
              </div>
              <div id="goal-completed-count" class="report-main-value">...</div>
            </div>
            <div class="card report-small-card">
              <div class="report-card-header">
                <h3 class="report-title" data-i18n="reports_goal_pending">
                  Bekleyen
                </h3>
                <span class="small-icon">
                  <img
                    src="assets/icons/hourglass.svg"
                    alt="Bekleyen"
                    class="report-icon-purple"
                  />
                </span>
              </div>
              <div id="goal-pending-count" class="report-main-value">...</div>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dark-mode.js"></script>
    <script src="js/reports.js"></script>
  </body>
</html>
