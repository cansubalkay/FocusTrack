<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Goals - FocusTrack</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/layout/sidebar.css" />
    <link rel="stylesheet" href="css/components/card.css" />
    <link rel="stylesheet" href="css/components/modal.css" />
    <link rel="stylesheet" href="css/pages/goals.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <div class="kapsayici">
      <!-- Hamburger menü ve sidebar için js divi  -->
      <div id="sidebar-container"></div>

      <main class="responsive-container">
        <div class="responsive-content">
          <header class="goals-header">
            <div class="goals-title-area">
              <h2>Goals</h2>
              <p>Manage your long-term objectives and track progress.</p>
            </div>
            <button class="btn-primary" id="openGoalModalBtn">+ Yeni Hedef</button>
          </header>
          <div class="goals-grid" id="goals-container"></div>
        </div>
      </main>
    </div>
    <script src="js/app.js"></script>
    <script src="js/dark-mode.js"></script>
    <script src="js/goals.js"></script>

    <!-- Yeni Hedef Modalı -->
    <div class="modal-overlay" id="goalModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3>Yeni Hedef Oluştur</h3>
          <button class="close-btn" id="closeGoalModalBtn">&times;</button>
        </div>
        <form id="newGoalForm">
          <div class="form-group">
            <label for="goalTitle">HEDEF BAŞLIĞI</label>
            <input
              type="text"
              id="goalTitle"
              placeholder="Örn: Yeni Tasarım Sistemini Tamamla"
              required
            />
          </div>
          <div class="form-group">
            <label for="goalDesc">AÇIKLAMA</label>
            <textarea
              id="goalDesc"
              rows="3"
              placeholder="Bu hedefin kapsamı ve detayları nelerdir?"
              required
            ></textarea>
          </div>
          <!-- Tarihleri yan yana almak için form-row kapsayıcısı -->
          <div class="form-row">
            <div class="form-group half-width">
              <label for="goalStartDate">BAŞLANGIÇ TARİHİ</label>
              <input type="date" id="goalStartDate" required />
            </div>
            <div class="form-group half-width">
              <label for="goalEndDate">BİTİŞ TARİHİ</label>
              <input type="date" id="goalEndDate" required />
            </div>
          </div>
          <div class="form-group">
            <div class="progress-label-group">
              <label for="goalProgress">BAŞLANGIÇ İLERLEMESİ</label>
            </div>
            <div class="progress-input-wrapper">
              <input
                type="number"
                id="goalProgress"
                value="0"
                min="0"
                max="100"
              />
              <span class="percent-sign">%</span>
            </div>
          </div>
          <!-- Butonlar -->
          <div class="modal-actions goal-actions">
            <button type="button" class="btn-cancel" id="cancelGoalModalBtn">
              İptal
            </button>
            <button type="submit" class="btn-save">Kaydet</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
