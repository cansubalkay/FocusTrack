<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ana Sayfa- Hoş Geldiniz</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/layout/sidebar.css" />
    <link rel="stylesheet" href="css/pages/dashboard.css" />
    <link rel="stylesheet" href="css/components/card.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/components/button.css">
  </head>
  <body>
    <div class="kapsayici">
      <!-- Hamburger menü ve sidebar için js divi  -->
      <div id="sidebar-container"></div>
      <main class="responsive-container">
        <div class="responsive-content">
          <div class="responsive-content">
            <header class="dashboard-header">
              <div class="header-text">
                <h2 id="user-greeting">Merhaba Cansu 👋</h2>
                <p>Here is your focus for today. Stay in the flow.</p>
              </div>
              <!-- dark tema butonu -->
              <button id="theme-toggle-btn" class="theme-btn">🌙</button>
            </header>
            <section class="dashboard-stats" id="stats-container"></section>
            <section class="dashboard-bottom-grid">
              <div class="card tasks-card">
                <div class="card-header">
                  <h3>Bugünkü Görevler</h3>
                  <a href="#" class="view-all">View All</a>
                </div>
                <ul class="task-list" id="dashboard-task-list"></ul>
              </div>
              <div class="card goals-card">
                <div class="card-header">
                  <h3>Bu Ayki Hedefler</h3>
                </div>
                <ul class="goal-list" id="dashboard-goal-list"></ul>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/dark-mode.js"></script>
  </body>
</html>
