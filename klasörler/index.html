<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="page_title_index">Ana Sayfa - Hoş Geldiniz</title>
    <link rel="stylesheet" href="css/global.css" />
    <link rel="stylesheet" href="css/layout/sidebar.css" />
    <link rel="stylesheet" href="css/pages/dashboard.css" />
    <link rel="stylesheet" href="css/components/card.css" />
    <link rel="stylesheet" href="css/responsive.css" />
    <link rel="stylesheet" href="css/components/button.css" />
    <link rel="stylesheet" href="css/components/dark-mode.css" />
  </head>
  <body>
    <div class="kapsayici">
      <div id="loadingScreen" class="loading-screen">
        <div class="loading-logo">FocusTrack</div>
        <div class="loading-spinner"></div>
      </div>
      <!-- Hamburger menü ve sidebar için js divi  -->
      <div id="sidebar-container"></div>
      <main class="responsive-container">
        <div class="responsive-content">
          <header class="dashboard-header">
            <div class="header-text">
              <h2 id="user-greeting">
                <span data-i18n="greeting">Merhaba</span> Cansu 👋
              </h2>
              <p data-i18n="focus_text">
                Bugün odaklanman gerekenler burada. Akışta kal.
              </p>
            </div>
            <div class="header-actions">
              <!-- dark tema ve dilceviri butonu -->
              <button
                id="lang-toggle-btn"
                class="theme-btn"
                onclick="toggleLanguage()"
              >
                <span id="lang-text">EN</span>
              </button>
              <button id="theme-toggle-btn" class="theme-btn">🌙</button>
            </div>
          </header>
          <section class="dashboard-stats" id="stats-container"></section>
          <section class="dashboard-bottom-grid">
            <div class="dashboard-column">
              <div class="section-header">
                <h3 data-i18n="today_tasks">Bugünkü Görevler</h3>
                <a href="tasks.html" class="view-all-link" data-i18n="view_all"
                  >Tümünü Gör</a
                >
              </div>
              <div class="tasks-wrapper" id="dashboard-task-list"></div>
            </div>
            <div class="dashboard-column">
              <div class="section-header">
                <h3 data-i18n="this_month_goals">Bu Ayki Hedefler</h3>
              </div>
              <div class="goals-wrapper" id="dashboard-goal-list"></div>
            </div>
          </section>
        </div>
      </main>
    </div>
    <script src="js/i18n.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/dark-mode.js"></script>
  </body>
</html>
